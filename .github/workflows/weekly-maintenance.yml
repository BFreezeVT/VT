name: Weekly Maintenance Check

# Runs every Monday at 14:00 UTC (8am CST / 9am CDT). Audits backend and
# frontend dependencies for known vulnerabilities, lists outdated packages,
# and opens a GitHub issue with the results so the weekly agent check has
# something concrete to work from. It never merges, deploys, or changes code.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  maintenance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend vulnerability audit
        run: |
          python3 -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt > backend-audit.txt 2>&1 || true
          echo "--- backend audit ---"
          cat backend-audit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Frontend vulnerability audit
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn audit --level moderate > ../frontend-audit.txt 2>&1 || true
          echo "--- frontend audit ---"
          cat ../frontend-audit.txt
      - name: Open weekly maintenance issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const read = (p) => {
              try { return fs.readFileSync(p, 'utf8').slice(0, 6000) || '(no output)'; }
              catch { return '(no output)'; }
            };
            const body = [
              'Weekly maintenance check for veracitytechmn.com (BFreezeVT/VT).',
              '',
              'This issue is the record for this week. Review the audits below, then',
              'let Dependabot PRs (or a manual PR) carry the actual fixes. Do not',
              'merge anything that breaks the frontend build or backend tests.',
              '',
              '## Backend audit (pip-audit, backend/requirements.txt)',
              '```',
              read('backend-audit.txt'),
              '```',
              '',
              '## Frontend audit (yarn audit, frontend/)',
              '```',
              read('frontend-audit.txt'),
              '```',
              '',
              '## Checklist',
              '- [ ] Review Dependabot PRs open this week',
              '- [ ] Fix any high/critical vulnerabilities (separate PR, tests pass)',
              '- [ ] Confirm frontend build + backend tests are green',
              '- [ ] Close this issue once reviewed',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly maintenance check — ${date}`,
              body,
              labels: ['maintenance'],
            });
