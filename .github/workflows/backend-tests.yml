name: Backend Tests

# Automatic regression check for the FastAPI backend. Runs the full pytest suite
# (backend/tests/) against a real MongoDB + a real running instance of the app on every push
# and pull request, so future changes get an automatic pass/fail signal before you deploy.
#
# Optional secrets (Settings -> Secrets and variables -> Actions) for full email-flow coverage:
#   SMTP_HOST, SMTP_USER, SMTP_PASS, NOTIFY_EMAIL, ADMIN_API_KEY
# Without them, SMTP-dependent tests are skipped automatically and everything else still runs.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: veracity_ci_test
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY || 'ci-test-admin-key-not-for-production' }}
      CORS_ORIGINS: "*"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || 'ci-test@example.com' }}
      REACT_APP_BACKEND_URL: http://localhost:8001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Write backend .env for this run
        working-directory: backend
        run: |
          {
            echo "MONGO_URL=$MONGO_URL"
            echo "DB_NAME=$DB_NAME"
            echo "ADMIN_API_KEY=$ADMIN_API_KEY"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "SMTP_HOST=$SMTP_HOST"
            echo "SMTP_PORT=$SMTP_PORT"
            echo "SMTP_USER=$SMTP_USER"
            echo "SMTP_PASS=$SMTP_PASS"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Start backend server
        working-directory: backend
        run: |
          nohup python3 -m uvicorn server:app --host 0.0.0.0 --port 8001 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start in time" && cat server.log && exit 1

      - name: Run pytest suite
        working-directory: backend
        run: pytest tests/ -v

      - name: Show backend logs on failure
        if: failure()
        working-directory: backend
        run: cat server.log || true
