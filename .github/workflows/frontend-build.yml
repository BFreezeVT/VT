name: Frontend Build

# Guardrail for every PR (including Dependabot PRs): the React frontend must
# still build before anything merges. The backend already has this coverage
# via backend-tests.yml; this is the frontend equivalent.
on:
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
        run: yarn build
